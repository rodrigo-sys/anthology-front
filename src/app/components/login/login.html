<form class="login-form" [formGroup]="form" (ngSubmit)="loginUser()">
  <div class="campo">
    <label for="username">Nombre de usuario</label>
    <input
      type="text"
      id="username"
      formControlName="username"
      placeholder="Nombre de usuario"
    />
    @if (form.controls.username.touched && form.controls.username.hasError('required')) {
      <span class="error">El campo de nombre de usuario es requerido</span>
    }
  </div>

  <div class="campo">
    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      placeholder="Contraseña"
    />
    @if (form.controls.password.touched && form.controls.password.hasError('required')) {
      <span class="error">La contraseña es requerida</span>
    }
  </div>

  <button class="btn-login" type="submit">Ingresar</button>
</form>
