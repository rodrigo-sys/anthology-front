<div class="playlist-list">
  <h3>Mis Playlists</h3>
  @if (playlists().length === 0) {
    <div>No hay playlists</div>
  }
  <ul>
    @for (playlist of playlists(); track playlist.id) {
      <li>
        <a [routerLink]="['/playlists', playlist.id]">{{ playlist.name }}</a>
      </li>
    }
  </ul>
</div>
