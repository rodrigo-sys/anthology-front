<div class="comments-page" [class.admin-mode]="songVersionId() === 0">
  @if (songVersionId() > 0) {
    <h1>Comentarios de la versión</h1>
    <app-comment-create [songVersionId]="songVersionId()"></app-comment-create>
  } @else {
    <h1>Comentarios</h1>
  }
  <app-comment-list [songVersionId]="songVersionId()"></app-comment-list>
</div>
