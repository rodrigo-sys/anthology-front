<div class="playlist-detail">
  @if (playlist(); as playlist) {
    <h2>{{ playlist.name }}</h2>
    <h3>Canciones</h3>
    @if (playlist.songVersions?.length) {
      <ul>
        @for (sv of playlist.songVersions; track sv.id) {
          <li>{{ sv.songTitle }} - {{ sv.instrument }}</li>
        }
      </ul>
    } @else {
      <div>No hay canciones</div>
    }
  }
</div>
